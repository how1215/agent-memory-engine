[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-engine"
version = "1.0.0"
description = "Framework-agnostic persistent memory infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["agents", "memory", "bm25", "retrieval", "local-first"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
hybrid = ["sentence-transformers>=2.7"]
test = ["pytest>=8"]

[project.scripts]
agent-memory = "agent_memory_engine.cli:main"
# Transitional alias for users of the original Pi-specific release.
pi-memory = "agent_memory_engine.cli:main"

[tool.setuptools.packages.find]
include = ["agent_memory_engine*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
